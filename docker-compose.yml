services:
  proof-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proof_lab
    restart: always
    environment:
      - DATABASE_PATH=/data/proof-lab.db
      # without this Auth.js rejects every request behind a proxy as UntrustedHost
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
    volumes:
      - proof_lab_data:/data
    # local testing only; on the server use the proxy's network instead
    ports:
      - '3000:3000'

volumes:
  proof_lab_data:
