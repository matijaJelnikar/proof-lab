services:
  proof-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proof_lab
    restart: always
    environment:
      - DATABASE_PATH=/data/proof-lab.db
      # without this Auth.js rejects every request behind a proxy as UntrustedHost
      - AUTH_TRUST_HOST=true
      # pins the public origin; without it Auth.js builds callbacks from
      # HOSTNAME:PORT and redirects to 0.0.0.0:3000
      - AUTH_URL=${AUTH_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
    volumes:
      - proof_lab_data:/data
    ports:
      - '3001:3000'

volumes:
  proof_lab_data:
